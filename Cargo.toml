[package]
name        = "kira-bio-tools"
version     = "0.2.0"
edition     = "2024"
description = "High-performance VCF indexer for bioinformatics using learned indexes"
license     = "MIT"
repository  = "https://github.com/ARyaskov/kira-bio-tools"
keywords    = ["vcf", "bioinformatics", "genomics", "index", "learned-index"]

[dependencies]
kira_kv_engine = { version = "0.1", features = ["serde", "parallel", "pgm"] }
thiserror = "1.0"
memmap2 = "0.9"
bytemuck = { version = "1.16", features = ["derive"] }

# Optional CLI dependencies
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["mmap", "cli"]
mmap = []
cli = ["clap", "anyhow"]

[[bin]]
name = "kira-vcf"
path = "src/bin/kira_vcf.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true