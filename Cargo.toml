[package]
name        = "kira_bio_tools"
version     = "0.1.0"
edition     = "2024"
description = "A new age bioinformatics tools"
license     = "MIT"
repository  = "https://github.com/ARyaskov/kira_bio_tools"
keywords    = ["pgm-index", "learned-index", "index", "search", "rust", "bio", "bioinformatics"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
num-traits = "0.2"
thiserror = "1.0"
anyhow = "1.0"
rand = "0.9"
crossbeam = "0.8"
bumpalo = "3.14"
rayon = "1.8"
bincode = "1.3"
flate2 = "1.0"
memchr = "2.7"

clap = { version = "4", features = ["derive"], optional = true }
noodles-bgzf = { version = "0.42", optional = true }
memmap2 = { version = "0.9", optional = true }
bytemuck = { version = "1.16", features = ["derive"], optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = { version = "0.5", optional = true }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
rand = "0.9"
tempfile = "3.8"


[features]
default = ["hybrid", "perfect-hash", "parallel"]

hybrid = []
perfect-hash = []
parallel = []
compression = []
persistence = []
genomics = ["noodles-bgzf", "memmap2", "bytemuck", "clap"]
jemalloc = ["jemallocator"]
mmap = ["memmap2"]


full = ["compression", "persistence", "genomics", "jemalloc", "parallel"]


[[bin]]
name = "pgm-hts"
path = "src/bin/pgm-hts.rs"
required-features = ["genomics"]


[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.maxspeed]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.bench]
inherits = "release"
debug = true
strip = false


[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2

[package.metadata.docs.rs]
features = ["hybrid", "perfect-hash", "parallel"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.playground]
features = ["hybrid", "perfect-hash", "parallel"]