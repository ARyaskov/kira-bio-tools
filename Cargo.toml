[package]
name = "kira-bio-tools"
version = "0.3.0"
edition = "2021"
description = "High-performance VCF indexer with full tabix compatibility"
license = "MIT"
repository = "https://github.com/ARyaskov/kira-bio-tools"
keywords = ["vcf", "bioinformatics", "genomics", "tabix", "index"]
categories = ["science", "command-line-utilities"]

[dependencies]
kira_kv_engine = { version = "0.1", features = ["parallel"] }
thiserror = "2.0"
memmap2 = "0.9"
bytemuck = { version = "1.21", features = ["derive"] }
rayon = "1.10"
memchr = "2.7"
indexmap = "2.7"
lazy_static = "1.5"

noodles-bgzf = "0.33"
noodles-csi = "0.40"
noodles-core = "0.15"

flate2 = "1.1"
crossbeam-channel = "0.5"

clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
thread_local = "1.1"
once_cell = "1.19"
fxhash = "0.2.1"

[dev-dependencies]
tempfile = "3.15"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[features]
default = ["cli"]
cli = ["clap", "anyhow"]

[[bin]]
name = "kira-bt"
path = "src/bin/kira_bt.rs"
required-features = ["cli"]

[[bench]]
name = "index_bench"
harness = false

[[bench]]
name = "query_bench"
harness = false

[[bench]]
name = "norm_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
debug = false