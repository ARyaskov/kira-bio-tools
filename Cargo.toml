[package]
name = "kira-bio-tools"
version = "0.6.2"
edition = "2024"
rust-version = "1.95"
description = "High-performance VCF indexer with full tabix compatibility"
license = "MIT"
repository = "https://github.com/ARyaskov/kira-bio-tools"
keywords = ["vcf", "bioinformatics", "genomics", "tabix", "bcf"]
categories = ["science", "command-line-utilities"]

[dependencies]
kira_kv_engine = "0.6.2"
thiserror = "2.0"
memmap2 = "0.9"
bytemuck = { version = "1.21", features = ["derive"] }
rayon = "1.10"
indexmap = "2.7"
lazy_static = "1.5"

noodles-bgzf = "0.47"
noodles-csi = "0.56"
noodles-bam = "0.89"
noodles-sam = "0.85"
noodles-fasta = "0.61"
noodles-cram = "0.93"
noodles-core = "0.20"


clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
thread_local = "1.1"
once_cell = "1.19"
fxhash = "0.2.1"
pest = "2.8.4"
pest_derive = "2.8.4"
regex = "1.11"
cust = { version = "0.3.2", optional = true }
which = "8.0.0"
flate2 = "1.1"
crc32fast = "1.4"
crossbeam-channel = "0.5"
indicatif = "0.18"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
memchr = "2.7"
itoa = "1.0"
num_cpus = "1.17"
percent-encoding = "2.3.2"
url = "2.5.7"
form_urlencoded = "1.2.2"

kira-bam = "0.3.1"
kira-ls-aligner = "0.4.3"

[dev-dependencies]
tempfile = "3.15"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[features]
default = ["cli"]
cli = ["clap", "anyhow"]
gpu = ["cust"]
avx2 = []
neon = []

[[bin]]
name = "kira-bt"
path = "src/bin/kira_bt.rs"
required-features = ["cli"]

[[bench]]
name = "index_bench"
harness = false

[[bench]]
name = "query_bench"
harness = false

[[bench]]
name = "annotate_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
debug = false

[build-dependencies]
pest_generator = "2.8.4"
cc = "1"
which = "8.0.0"
