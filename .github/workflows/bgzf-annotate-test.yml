name: BGZF Annotation Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-bgzf-annotation:
    name: Test BGZF Annotation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install bgzip (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y tabix
        
    - name: Build kira-bt
      run: cargo build --release --features cli
      
    - name: Prepare test files
      shell: bash
      run: |
        # Create plain VCF test files
        cp annotate.vcf test_input.vcf
        cp annotate.db.vcf test_db.vcf
        
        # Compress with bgzip
        bgzip -c test_input.vcf > test_input.vcf.gz
        bgzip -c test_db.vcf > test_db.vcf.gz
        
    - name: Test 1 - Plain VCF (baseline)
      shell: bash
      run: |
        ./target/release/kira-bt annotate-index test_db.vcf -o test_db.ani
        KIRA_BT_TIMING=1 ./target/release/kira-bt annotate \
          -a test_db.ani test_input.vcf -o output_plain.vcf
        
    - name: Test 2 - BGZF input, plain database
      shell: bash
      run: |
        KIRA_BT_TIMING=1 ./target/release/kira-bt annotate \
          -a test_db.ani test_input.vcf.gz -o output_bgzf_input.vcf
        
    - name: Test 3 - BGZF database, plain input
      shell: bash
      run: |
        ./target/release/kira-bt annotate-index test_db.vcf.gz -o test_db_bgzf.ani
        KIRA_BT_TIMING=1 ./target/release/kira-bt annotate \
          -a test_db_bgzf.ani test_input.vcf -o output_bgzf_db.vcf
        
    - name: Test 4 - Both BGZF
      shell: bash
      run: |
        KIRA_BT_TIMING=1 ./target/release/kira-bt annotate \
          -a test_db_bgzf.ani test_input.vcf.gz -o output_both_bgzf.vcf
        
    - name: Verify outputs
      shell: bash
      run: |
        # All outputs should be identical
        diff output_plain.vcf output_bgzf_input.vcf
        diff output_plain.vcf output_bgzf_db.vcf
        diff output_plain.vcf output_both_bgzf.vcf
        echo "✓ All outputs match!"
        
    - name: Benchmark comparison
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Create larger test file
        for i in {1..10}; do cat test_input.vcf >> large_input.vcf; done
        bgzip -c large_input.vcf > large_input.vcf.gz
        
        # Benchmark plain
        echo "=== Plain VCF ==="
        time ./target/release/kira-bt annotate \
          -a test_db.ani large_input.vcf -o bench_plain.vcf
        
        # Benchmark BGZF
        echo "=== BGZF VCF ==="
        time ./target/release/kira-bt annotate \
          -a test_db.ani large_input.vcf.gz -o bench_bgzf.vcf