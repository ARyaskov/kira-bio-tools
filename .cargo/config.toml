[build]
rustflags = [
    "-Z", "dylib-lto",
    "-C", "target-cpu=native",
    "-C", "opt-level=3",
    "-C", "lto=fat",
    "-C", "codegen-units=1",
    "-C", "panic=abort",
    "-C", "embed-bitcode=true"
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "target-feature=+avx2,+fma,+bmi1,+bmi2,+popcnt,+lzcnt,+sse4.2",
    "-C", "opt-level=3",
    "-C", "codegen-units=1",
    "-C", "lto=fat",
    "-C", "panic=abort",
    "-C", "overflow-checks=no",
    "-C", "debug-assertions=no",
    "-C", "inline-threshold=1000",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,-O3",
]

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-Z", "dylib-lto",
    "-C", "target-cpu=native",
    "-C", "target-feature=+avx2,+fma,+bmi1,+bmi2,+popcnt,+lzcnt,+sse4.2",
    "-C", "opt-level=3",
    "-C", "codegen-units=1",
    "-C", "lto=fat",
    "-C", "panic=abort",
    "-C", "target-feature=+crt-static",
    "-C", "embed-bitcode=true",
]

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false
incremental = false
embed-bitcode=true

[profile.maxspeed]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false

[profile.bench-extreme]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
overflow-checks = false
debug-assertions = false

[profile.fast]
inherits = "release"
lto = "fat"
codegen-units = 4

[profile.fastest]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.ultra]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[alias]
pgm = "run --release --features mmap,genomics --bin pgm-hts --"
pgmi = "run --release --features mmap,genomics --bin pgm-hts -- index-vcf"
pgmf = "run --release --features mmap,genomics --bin pgm-hts -- fetch-vcf"
pgmb = "run --release --features mmap,genomics --bin pgm-hts -- bench-vcf"

pgmi-m-save = "run --profile maxspeed --features mmap,genomics --bin pgm-hts -- index-vcf --mmap-save"
pgmstat     = "run --profile maxspeed --features mmap,genomics --bin pgm-hts -- stat-pgmi --chrmap"
pgmquery    = "run --profile maxspeed --features mmap,genomics --bin pgm-hts -- query-pgmi"

[env]
CARGO_PROFILE_RELEASE_LTO = "fat"
CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1"
CARGO_PROFILE_RELEASE_PANIC = "abort"
RAYON_NUM_THREADS = "0"
MALLOC_CONF = "dirty_decay_ms:1000,muzzy_decay_ms:1000,lg_tcache_max:15"