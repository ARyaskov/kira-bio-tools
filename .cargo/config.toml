# Portable defaults: no `target-cpu=native` and no forced AVX2, so a binary built
# by `cargo install` runs on any x86_64. SIMD paths are selected at runtime via
# `is_x86_feature_detected!`. Set RUSTFLAGS="-C target-cpu=native" yourself for
# a machine-specific build.

[build]
jobs = 8

[net]
git-fetch-with-cli = true
